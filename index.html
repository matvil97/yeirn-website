<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YEIRN — Flow Worship</title>

  <meta
    name="description"
    content="Flow Worship — un événement de louange libre le 13 juin, de 19h à 22h, au Lamentin en Martinique."
  />

  <link rel="icon" href="assets/img/logo.png" type="image/png" />

  <style>
    :root {
      --orange: #f58200;
      --cream: #e8ded2;
      --dark: #2f2f2f;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--cream);
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--dark);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .poster {
      width: min(100%, 620px);
      position: relative;
    }

    .poster img {
      width: 100%;
      display: block;
      border-radius: 2px;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      width: min(78%, 360px);
      text-align: center;
    }

    .cta a {
      display: block;
      padding: 16px 22px;
      background: var(--orange);
      color: var(--white);
      text-decoration: none;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    .cta a:hover {
      transform: translateY(-2px);
    }

    .links {
      padding: 20px;
      display: grid;
      gap: 10px;
      max-width: 620px;
      width: 100%;
      margin: 0 auto 24px;
    }

    .links a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 2px solid var(--orange);
      color: var(--orange);
      text-decoration: none;
      font-weight: 900;
      text-transform: uppercase;
      font-size: clamp(24px, 7vw, 40px);
    }

    footer {
      text-align: center;
      padding: 14px;
      color: var(--dark);
      font-size: 14px;
    }

    @media (max-width: 520px) {
      .hero {
        padding: 0;
      }

      .poster {
        width: 100%;
      }

      .poster img {
        border-radius: 0;
      }

      .cta {
        bottom: 6%;
      }

      .cta a {
        padding: 14px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero" aria-label="Flow Worship">
      <div class="poster">
        <img
          src="assets/img/flow-worship-13-juin.jpeg"
          alt="Flow Worship — le 13 juin de 19h à 22h au Lamentin, Martinique"
        />

        <div class="cta">
          <a href="participer.html">Je m’inscris</a>
        </div>
      </div>
    </section>

    <nav class="links" aria-label="Navigation YEIRN">
      <a href="participer.html">Inscription <span>→</span></a>
      <a href="flow-worship.html">Flow Worship <span>→</span></a>
      <a href="contact.html">Contact <span>→</span></a>
    </nav>

    <footer>
      2026 — YEIRN
    </footer>
  </main>
</body>
</html>
